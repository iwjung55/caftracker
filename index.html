<!doctype html>
<!--
  THESIS: The chart is the dashboard. A one-pen strip-chart recorder plots the caffeine active in your body across the day; it refuses the stat-card grid, the progress ring, and the coffee-brown cozy app.
  OWN-WORLD: Instrument-grey enamel housing; a dark bezel framing green-ruled chart paper; crimson caffeine ink with dashed projection and a faint uncertainty band; event-marker keys as hardware keycaps; Barlow and Barlow Condensed as printed scale type. Night chart: graphite paper, luminous ink.
  STORY: See what is active now, where tonight lands against your bedtime target, and the last time a usual cup still fits. Log a drink in two taps; the pen re-plots the rest of the day.
  FIRST VIEWPORT: Full-width chart, day start to after bedtime, pen at now, last-cup and bedtime ruled on the paper; readout panel right (desktop) or below (mobile); event keys directly beneath.
  FORM: Lab strip-chart recorder, candidate 4 of 7; staging: continuous trace; seed 0d34e14e.
-->
